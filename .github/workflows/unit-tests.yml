name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  unit:
    name: Unit (jest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@ubc'

      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # onnxruntime-node (via fastembed) downloads a multi-hundred-MB CUDA
          # build on linux/x64 whether or not a GPU is present, and that download
          # is what fails the install here. Runners have no GPU, so the CPU
          # binary is all this needs.
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Upload unit coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage-reports/unit/
          retention-days: 14
